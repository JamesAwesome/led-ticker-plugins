# Virtual workspace root: no [build-system], so uv treats this as a
# non-package workspace whose real packages live under plugins/*.
[tool.uv.workspace]
members = ["plugins/*"]

# The engine (`led-ticker-core`) resolves from PyPI like any other dependency;
# members declare `led-ticker-core>=2.1` (the release shipping HeadlessBackend, the
# software backend tests use via `led_ticker.plugin`). No sibling checkout / uv
# source override is needed. To co-develop against an unreleased engine, install it
# editable on top of the synced env: `uv pip install -e ../led-ticker`.

[tool.ruff]
target-version = "py314"
src = ["plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.14"
# Plugin tests are intentionally un-typechecked PROJECT-WIDE: they deliberately
# monkeypatch modules by assignment, access private attrs, and pass bad kwargs
# to assert error paths — all pyright errors by design. CI and `make typecheck`
# have only ever scoped pyright to plugins/*/src; this keeps a local
# `pyright plugins/<x>` identical to CI (0 errors == 0 real errors). The
# repo-root tests/ dir is NOT excluded and stays typechecked.
exclude = ["plugins/*/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Repo root on the import path so the root tests/ package resolves; run pytest
# from the repo root. (The headless canvas now comes from led_ticker.plugin's
# shipped HeadlessBackend — no vendored rgbmatrix stub on the path.)
pythonpath = ["."]
# importlib import mode so members can share test basenames (test_smoke.py,
# test_import_purity.py) across plugins without __init__.py collisions when
# the whole workspace is collected at once (make test). Per-member CI runs
# are unaffected.
addopts = "--import-mode=importlib"

[tool.coverage.report]
fail_under = 90
