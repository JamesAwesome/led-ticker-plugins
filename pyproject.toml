# Virtual workspace root: no [build-system], so uv treats this as a
# non-package workspace whose real packages live under plugins/*.
[tool.uv.workspace]
members = ["plugins/*"]

# The engine is a sibling checkout, sourced once here for the whole workspace.
# pip/git installs ignore this (uv-only metadata) and resolve led-ticker-core from
# the pre-installed, constraint-pinned engine — see docs/spike/p0-install-model.md.
# NOTE: the key MUST match the engine's distribution name (`led-ticker-core`), which
# members depend on as `led-ticker-core>=2.0`; the `../led-ticker` value is just the
# sibling checkout directory name (set by CI's `path: led-ticker`).
[tool.uv.sources]
led-ticker-core = { path = "../led-ticker", editable = true }

[tool.ruff]
target-version = "py314"
src = ["plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.14"
extraPaths = ["tests/stubs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Vendored stub on the import path; run pytest from the repo root.
pythonpath = ["tests/stubs"]
# importlib import mode so members can share test basenames (test_smoke.py,
# test_import_purity.py) across plugins without __init__.py collisions when
# the whole workspace is collected at once (make test). Per-member CI runs
# are unaffected.
addopts = "--import-mode=importlib"

[tool.coverage.report]
fail_under = 90
