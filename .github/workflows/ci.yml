name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Compute the member matrix from changed paths. A change under tests/, the
  # root pyproject, or the workflow runs ALL members; otherwise only the
  # plugins/<name> dirs that changed.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.set.outputs.members }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # Full history + tags: per-plugin hatch-vcs runs `git describe --match
          # <plugin>-v*`. uv sync itself survives a shallow clone (fallback_version
          # 0.0.0), but test_versioning.py::test_versions_are_tag_scoped needs the
          # tags to prove per-plugin scoping — don't drop this.
          fetch-depth: 0
          path: led-ticker-plugins
      - id: set
        working-directory: led-ticker-plugins
        run: |
          ALL=$(ls -d plugins/*/ | sed 's#plugins/##; s#/##' | jq -R . | jq -cs .)
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "members=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          if echo "$CHANGED" | grep -qE '^(pyproject\.toml|tests/|\.github/workflows/ci\.yml)'; then
            echo "members=$ALL" >> "$GITHUB_OUTPUT"
          else
            M=$(echo "$CHANGED" | grep -oE '^plugins/[^/]+/' | sed 's#plugins/##; s#/##' | sort -u | jq -R . | jq -cs .)
            [ "$M" = "[]" ] && M="$ALL"
            echo "members=$M" >> "$GITHUB_OUTPUT"
          fi
      # Regression guard: the core section modes were renamed in core v3
      # (swap->slideshow, forever_scroll->ticker, infini_scroll->one_at_a_time);
      # old names now hard-error at config-load. Keep them out of plugin docs +
      # smoketest configs. (Archived docs/superpowers/ plans are exempt.)
      - name: No legacy section-mode names
        working-directory: led-ticker-plugins
        run: |
          hits=$(grep -rnE "mode[[:space:]]*=[[:space:]]*['\"](swap|forever_scroll|infini_scroll)['\"]|\bforever_scroll\b|\binfini_scroll\b" plugins/ \
            --include='*.toml' --include='*.md' --include='*.mdx' --include='*.py' --include='*.txt' \
            | grep -v '/docs/superpowers/' || true)
          if [ -n "$hits" ]; then
            echo "::error::legacy section-mode name(s) found — rename to slideshow/ticker/one_at_a_time:"
            echo "$hits"
            exit 1
          fi
          echo "no legacy section-mode names"

  check:
    needs: matrix
    if: needs.matrix.outputs.members != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJson(needs.matrix.outputs.members) }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # Full history + tags: per-plugin hatch-vcs runs `git describe --match
          # <plugin>-v*`. uv sync itself survives a shallow clone (fallback_version
          # 0.0.0), but test_versioning.py::test_versions_are_tag_scoped needs the
          # tags to prove per-plugin scoping — don't drop this.
          fetch-depth: 0
          path: led-ticker-plugins
      # No engine checkout: led-ticker-core resolves from PyPI (>=2.1, ships the
      # HeadlessBackend that tests use via led_ticker.plugin).
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Sync workspace
        working-directory: led-ticker-plugins
        run: uv sync --extra dev
      - name: Ruff check
        working-directory: led-ticker-plugins
        run: uv run ruff check plugins/${{ matrix.member }}
      - name: Ruff format check
        working-directory: led-ticker-plugins
        run: uv run ruff format --check plugins/${{ matrix.member }}
      - name: Pyright
        working-directory: led-ticker-plugins
        run: uv run pyright plugins/${{ matrix.member }}/src
      - name: Test
        working-directory: led-ticker-plugins
        run: uv run pytest plugins/${{ matrix.member }} --cov=plugins/${{ matrix.member }}/src --cov-report=term-missing

  # The repo-root tests/ dir (versioning + release-guard tripwires) is NOT part
  # of the per-member matrix — those tests are about the workspace as a whole, so
  # they run once here rather than 12x. Before this job existed they ran NOWHERE
  # in CI, which is how test_versions_are_tag_scoped rotted unnoticed while this
  # workflow carried a comment claiming fetch-depth: 0 existed to serve it.
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # Tags required: test_versioning.py compares each plugin's installed
          # version against its own `<plugin>-v*` tags.
          fetch-depth: 0
          path: led-ticker-plugins
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Sync workspace
        working-directory: led-ticker-plugins
        run: uv sync --extra dev
      - name: Ruff check
        working-directory: led-ticker-plugins
        run: uv run ruff check tests
      - name: Ruff format check
        working-directory: led-ticker-plugins
        run: uv run ruff format --check tests
      - name: Test
        working-directory: led-ticker-plugins
        run: uv run pytest tests

  ci-passed:
    needs: [check, root-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "matrix check did not succeed: ${{ needs.check.result }}"; exit 1
          fi
          if [ "${{ needs.root-tests.result }}" != "success" ]; then
            echo "root tests/ did not succeed: ${{ needs.root-tests.result }}"; exit 1
          fi
          echo "all member checks + root tests passed"
