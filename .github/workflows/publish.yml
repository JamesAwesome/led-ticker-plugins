name: publish

# Publishes a single data plugin to PyPI via OIDC Trusted Publishing when a
# GitHub Release tagged `<plugin>-vX.Y.Z` is published (the 6 data plugins +
# the `flair` homage pack; gated by scripts/check_release.py). GitHub-hosted
# runner, `release`-gated.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0   # hatch-vcs derives each plugin's version from its tag
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Resolve + guard the release tag
        id: resolve
        run: |
          set -euo pipefail
          DIR="$(python scripts/check_release.py "${{ github.event.release.tag_name }}")"
          echo "plugin_dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Build the plugin
        run: |
          cd "${{ steps.resolve.outputs.plugin_dir }}"
          rm -rf dist && uv build --out-dir dist
      - name: Guard — built version matches the release tag
        run: |
          set -euo pipefail
          DIR="${{ steps.resolve.outputs.plugin_dir }}"
          WANT="${{ github.event.release.tag_name }}"; WANT="${WANT##*-v}"   # telnet-v0.1.0 -> 0.1.0
          # A wheel named *-<WANT>-py3-none-any.whl must exist (robust vs parsing).
          ls "$DIR"/dist/*-"$WANT"-py3-none-any.whl >/dev/null 2>&1 \
            || { echo "::error::No wheel for version $WANT in $DIR/dist — built version != tag $WANT, refusing to publish."; ls "$DIR"/dist; exit 1; }
          echo "OK: wheel matches tag version $WANT"
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ${{ steps.resolve.outputs.plugin_dir }}/dist/
