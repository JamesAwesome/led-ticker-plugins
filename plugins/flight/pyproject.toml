[project]
name = "led-ticker-flight"
dynamic = ["version"]
description = "Planes-overhead ADS-B flight tracker widget for led-ticker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
keywords = [
    "led-ticker",
    "led-ticker-plugin",
    "raspberry-pi",
    "led-matrix",
    "rgb-led-matrix",
    "flight-tracker",
    "adsb",
    "aviation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Framework :: AsyncIO",
]
dependencies = ["led-ticker-core>=4.8", "aiohttp>=3.9"]

[project.entry-points."led_ticker.plugins"]
flight = "led_ticker_flight:register"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "pyright>=1.1"]

[project.urls]
Homepage = "https://docs.ledticker.dev"
Repository = "https://github.com/JamesAwesome/led-ticker-plugins"
Issues = "https://github.com/JamesAwesome/led-ticker-plugins/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "flight-v*"]
tag_regex = "^(?:.+-v)(?P<version>[0-9].*)$"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_flight"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
