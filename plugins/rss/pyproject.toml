[project]
name = "led-ticker-rss"
dynamic = ["version"]
description = "RSS/Atom headline widget for led-ticker (rss.feed)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
keywords = [
    "led-ticker",
    "led-ticker-plugin",
    "raspberry-pi",
    "led-matrix",
    "rgb-led-matrix",
    "rss",
    "atom",
    "feed",
    "news",
    "headlines",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
dependencies = [
    "led-ticker-core>=2.1",
    "aiohttp",
    "feedparser>=6.0",
]

# Entry-point NAME ("rss") is the plugin namespace -> TOML `type = "rss.feed"`.
[project.entry-points."led_ticker.plugins"]
rss = "led_ticker_rss:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://docs.ledticker.dev"
Documentation = "https://docs.ledticker.dev/plugins/"
Repository = "https://github.com/JamesAwesome/led-ticker-plugins"
Issues = "https://github.com/JamesAwesome/led-ticker-plugins/issues"
Changelog = "https://github.com/JamesAwesome/led-ticker-plugins/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Per-plugin tag scoping: only rss-v* tags count toward rss's version.
root = "../.."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "rss-v*"]
tag_regex = "^(?:.+-v)(?P<version>[0-9].*)$"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_rss"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
