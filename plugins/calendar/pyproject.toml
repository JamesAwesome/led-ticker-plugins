[project]
name = "led-ticker-calendar"
dynamic = ["version"]
description = "Calendar (.ics) agenda/next/two_row widget for led-ticker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
keywords = [
    "led-ticker",
    "led-ticker-plugin",
    "raspberry-pi",
    "led-matrix",
    "rgb-led-matrix",
    "calendar",
    "icalendar",
    "ics",
    "agenda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
dependencies = [
    "led-ticker-core>=2.1",
    "aiohttp",
    "icalendar>=6.1",
    "recurring-ical-events>=3.0",
]

# The plugin is contributed to led-ticker via this entry point. The entry-point
# NAME ("calendar") becomes the plugin namespace, so the widget is referenced in
# TOML as `type = "calendar.events"`.
[project.entry-points."led_ticker.plugins"]
calendar = "led_ticker_calendar:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://docs.ledticker.dev"
Repository = "https://github.com/JamesAwesome/led-ticker-plugins"
Issues = "https://github.com/JamesAwesome/led-ticker-plugins/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Per-plugin tag scoping: only calendar-v* tags count toward calendar's version.
root = "../.."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "calendar-v*"]
tag_regex = "^(?:.+-v)(?P<version>[0-9].*)$"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_calendar"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
