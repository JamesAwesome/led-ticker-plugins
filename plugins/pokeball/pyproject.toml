[project]
name = "led-ticker-pokeball"
version = "0.1.0"
description = "Pokeball/Pikachu sprite-trail transitions + :pokeball.ball: emoji for led-ticker."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
dependencies = [
    "led-ticker-core",
]

# Entry-point NAME ("pokeball") is the plugin namespace -> TOML `transition = "pokeball.forward"`,
# emoji `:pokeball.ball:`.
[project.entry-points."led_ticker.plugins"]
pokeball = "led_ticker_pokeball:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_pokeball"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
