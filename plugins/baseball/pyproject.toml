[project]
name = "led-ticker-baseball"
version = "0.1.0"
description = "MLB scores/standings widgets, baseball emoji, and baseball transitions for led-ticker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
keywords = [
    "led-ticker",
    "led-ticker-plugin",
    "raspberry-pi",
    "led-matrix",
    "rgb-led-matrix",
    "baseball",
    "mlb",
    "scores",
    "standings",
    "sports",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
dependencies = [
    "led-ticker-core>=2.1",
    "aiohttp",
    "pillow",
]

# The plugin is contributed to led-ticker via this entry point. The entry-point
# NAME ("baseball") becomes the plugin namespace, so widgets are referenced in
# TOML as `type = "baseball.scores"` / `"baseball.standings"`, transitions as
# `baseball.roll*`, and the emoji as `:baseball.ball:`.
[project.entry-points."led_ticker.plugins"]
baseball = "led_ticker_baseball:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://docs.ledticker.dev"
Repository = "https://github.com/JamesAwesome/led-ticker-plugins"
Issues = "https://github.com/JamesAwesome/led-ticker-plugins/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_baseball"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
