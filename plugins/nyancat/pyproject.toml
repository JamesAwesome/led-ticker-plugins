[project]
name = "led-ticker-nyancat"
version = "0.1.0"
description = "Nyan Cat sprite-trail transitions for led-ticker (nyancat.forward/.reverse/.alternating)."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
dependencies = [
    "led-ticker-core",
]

# Entry-point NAME ("nyancat") is the plugin namespace -> TOML `transition = "nyancat.forward"`.
[project.entry-points."led_ticker.plugins"]
nyancat = "led_ticker_nyancat:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_nyancat"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
