# render-duration: 18
# Demo config for the stocks.ticker widget (multi-symbol equity crawl).
# demo = true seeds a deterministic offline random-walk feed so this config
# renders with no FINNHUB_API_TOKEN and no network access.
[display]
rows = 16
cols = 32
chain_length = 5
default_scale = 1
brightness = 60

[[playlist.section]]
mode = "ticker"

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA"]
demo = true
