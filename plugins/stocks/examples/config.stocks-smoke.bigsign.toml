# Bigsign SMOKE TEST — stocks.ticker CARD + a HI-RES, MIXED-COLOR inline token
#
# The card WIDGET and the inline `:stocks.dks:` TOKEN share ONE `QuoteCache`
# (DKS fetched once per cycle for both — dedup). The token line here is a HI-RES
# (Inter-Bold) + MIXED-COLOR demo: the literal "DKS " is white (the message
# `font_color`) and the price is GREEN (up) / RED (down) by trend, because the
# `[[source]]` carries a `color` provider (`stocks.trend`) that colors just the
# token. Two colors on ONE hi-res line is the thing to hardware-validate.
#
# No `layout` override on the ticker on purpose: `resolve_layout` reads the real
# (unwrapped) canvas width and auto-selects `card` at this geometry (~256px real
# width) — the same auto-select a config in the wild gets by just omitting
# `layout`. `mode = "slideshow"` is the recommended mode for held layouts (card
# holds one symbol per visit, unlike the scrolling `crawl`, which wants `ticker`).
#
# Prereqs on the sign:
#   - led-ticker-core >= 4.14.0 (colored value tokens — a `[[source]] color`
#     that tints just the `:id:` token). On an OLDER
#     core the `color` line is ignored and the whole message renders in
#     `font_color` (white) — no mixed color; hi-res + everything else still work.
#   - led-ticker-stocks >= 0.5.0 (the `stocks.trend` color provider). In
#     config/requirements-plugins.txt:  led-ticker-stocks==0.5.0
#   - copy to config/config.toml, then `make restart`
#
# ONE MODE PER PROCESS (shared cache, first-started-wins):
#   - DEMO (default): leave `demo = true` on the card and DON'T set a token.
#     The whole cache — card AND inline token — runs the synthesized feed.
#   - LIVE: put FINNHUB_API_TOKEN=xxxxx in .env (secrets are env-only, never
#     here) AND remove `demo = true`. Real prices everywhere.
#   - Don't mix: a token in .env WITH `demo = true` is a race (whichever
#     consumer starts the cache first wins the mode) — pick one.
#
# Preflight: led-ticker validate config/config.toml  -> expect: No issues found.
#
# WHAT TO LOOK FOR:
#   1 HI-RES MIXED-COLOR TOKEN — a held (scroll-on-overflow) HI-RES Inter-Bold
#                    MESSAGE reading "DKS 000.00 +0.00%". The "DKS " label is
#                    WHITE; the price + signed percent are GREEN when DKS is up on
#                    the day, RED when down (trend color on the TOKEN only). Verify
#                    BOTH: crisp hi-res glyphs AND two colors on one line. In demo
#                    the price random-walks so the color flips over ~30s. This DKS
#                    is the SAME DKS the card fetches — one cache, one fetch.
#   2 CARD (per symbol, HELD ~5.2s, then transitions to the next symbol) —
#                    one hero CARD per symbol: big SYMBOL (top-left) + big PRICE
#                    (top-right), both bold hi-res. Below the price: a ▲/▼ arrow
#                    + signed change + signed percent, green (up) / red (down).
#                    A brand CHIP (abstract two-tone diagonal block, never a
#                    logo) sits left of the symbol. Below that: a SPARKLINE
#                    spanning most of the card width — a dotted prev-close
#                    reference line plus an up/down-colored trend line with a
#                    white leading-edge dot. Bottom-right: a state chip label
#                    ("LIVE" while demo=OPEN) + small PAGING DOTS tracking which
#                    symbol (of 4) is showing. On a price change, a Bloomberg
#                    PRICE-FLASH (Phase 3) briefly tints the price cell; the LIVE
#                    chip + sparkline endpoint PULSE while open. Nothing should
#                    clip at the 64px ceiling. In live mode global brightness +
#                    the state-chip label track market state (LIVE full / PRE·AH
#                    ~0.85 dimmer / CLOSED ~0.45 dimmest + "AT CLOSE", frozen).
#                    Bad symbol -> em-dash price with no sparkline.
#
# If anything looks wrong: docs/visual-validation.md.

[display]
rows = 32
cols = 64
chain_length = 8
parallel = 1
pixel_mapper_config = "Remap:256,64|192,32n|192,0n|128,32n|128,0n|64,32n|64,0n|0,32n|0,0n"
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
gpio_slowdown = 3
pwm_bits = 8

# stocks.quote source: DKS as an inline `:stocks.dks:` token, shared with the
# card (one fetch for both). `color` tints JUST the token by trend — green up /
# red down (same provider the ticker widget uses). `format` drops the arrow glyph
# (the color conveys direction, and hi-res Inter has no ▲/▼ glyph).
[[source]]
id = "stocks.dks"
type = "stocks.quote"
symbol = "DKS"
format = "{price} {pct}"
color = {style = "stocks.trend", symbol = "DKS"}
# interval = 60

# --- 1: hi-res mixed-color inline token (shares the cache with the card) -------
[[playlist.section]]
mode = "slideshow"
hold_time = 5.2

[[playlist.section.widget]]
type = "message"
text = "DKS :stocks.dks:"
font = "Inter-Bold"            # bundled hi-res font (scale 4)
font_size = 44
font_threshold = 80           # thin-stroke hi-res needs a lower threshold
font_color = [255, 255, 255]  # "DKS " white; the token is trend-colored

# --- 2: stocks.ticker card ----------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 5.2

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["DKS", "MSFT", "NVDA", "TSLA"]
demo = true
# update_interval = 60 # (LIVE only) with a token set + `demo` removed
