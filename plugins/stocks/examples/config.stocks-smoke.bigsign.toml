# Bigsign SMOKE TEST — stocks.ticker equity crawl at scale 4 (pre-merge branch)
#
# Phase 1 ships the CRAWL only; the hi-res quote CARD for the bigsign is Phase 2.
# So this smoke forces `layout = "crawl"` — you'll see chunky scale-4 BDF text
# scrolling, NOT the hero card yet. That's expected for Phase 1.
#
# Prereqs on the sign:
#   - led-ticker-core >= 4.9
#   - stocks plugin (NOT yet released — Phase 1 PR #42). Add to
#     config/requirements-plugins.txt the git ref:
#       led-ticker-stocks @ git+https://github.com/JamesAwesome/led-ticker-plugins.git@feat/stocks-phase1#subdirectory=plugins/stocks
#   - Section 1 (demo) needs NO token. Section 2 (live) needs:
#       FINNHUB_API_TOKEN=xxxxx   in .env  (secrets are env-only, never here)
#   - copy to config/config.toml, then `make restart`
#
# Preflight: led-ticker validate config/config.toml  -> expect: No issues found.
#
# WHAT TO LOOK FOR, section by section:
#   1 DEMO FEED   — AAPL / MSFT / NVDA / TSLA crawl right->left at scale 4,
#                   vertically centered, looping seamlessly. Per symbol: WHITE
#                   ticker -> AMBER price -> GREEN ▲ / RED ▼ change block (arrow +
#                   signed change + signed percent). FULL brightness (demo=OPEN);
#                   change colors flicker up/down as the demo walk moves prices.
#                   Text should be crisp 4x4-block glyphs, none clipped top/bottom
#                   (content fills the 64px height exactly at scale 4).
#   2 LIVE FEED   — real prices; global brightness tracks market state (LIVE full /
#                   PRE·AH ~0.85 / CLOSED ~0.45 + prices frozen at last close).
#                   Bad symbol -> "SYM —". Prices refresh ~once a minute when open.
#
# NOT here yet (Phase 2/3): hi-res quote card, sparkline, state chip, brand chips,
# price-flash. Phase 2 will auto-select the card on this geometry (drop the
# `layout` line) — for now the crawl override is intentional.
#
# If anything looks wrong: docs/visual-validation.md.

[display]
rows = 32
cols = 64
chain_length = 8
parallel = 1
pixel_mapper_config = "Remap:256,64|192,32n|192,0n|128,32n|128,0n|64,32n|64,0n|0,32n|0,0n"
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
gpio_slowdown = 3
pwm_bits = 8

# --- 1: demo feed (offline, no token) -----------------------------------------
[[playlist.section]]
mode = "ticker"

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA"]
demo = true
layout = "crawl"   # Phase 1: card is Phase 2, so force the crawl on the bigsign

# --- 2: live feed (needs FINNHUB_API_TOKEN in .env) ---------------------------
[[playlist.section]]
mode = "ticker"

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA", "AMZN", "GOOGL"]
layout = "crawl"
update_interval = 60
