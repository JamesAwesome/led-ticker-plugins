# Bigsign SMOKE TEST — stocks.ticker CARD layout at scale 4 (pre-merge branch)
#
# No `layout` override here on purpose: `resolve_layout` reads the real
# (unwrapped) canvas width and auto-selects `card` at this geometry
# (~256px real width) — the same auto-select a config in the wild gets by
# just omitting `layout`. `mode = "slideshow"` is the recommended section
# mode for held layouts (card/dashboard hold one symbol per visit, unlike
# the scrolling `crawl`, which wants `mode = "ticker"`).
#
# Prereqs on the sign:
#   - led-ticker-core >= 4.9
#   - stocks plugin (NOT yet released — Phase 2 PR). Add to
#     config/requirements-plugins.txt the git ref:
#       led-ticker-stocks @ git+https://github.com/JamesAwesome/led-ticker-plugins.git@feat/stocks-phase2#subdirectory=plugins/stocks
#   - Section 1 (demo) needs NO token. Section 2 (live) needs:
#       FINNHUB_API_TOKEN=xxxxx   in .env  (secrets are env-only, never here)
#   - copy to config/config.toml, then `make restart`
#
# Preflight: led-ticker validate config/config.toml  -> expect: No issues found.
#
# WHAT TO LOOK FOR, section by section (each symbol HELD ~5.2s, then the
# section transitions to the next symbol):
#   1 DEMO FEED   — one hero CARD per symbol: big SYMBOL (top-left) + big
#                   PRICE (top-right), both bold hi-res. Below the price: a
#                   ▲/▼ arrow + signed change + signed percent, green (up) /
#                   red (down). A brand CHIP (abstract two-tone diagonal
#                   block, never a logo) sits left of the symbol. Below
#                   that: a SPARKLINE spanning most of the card width — a
#                   dotted prev-close reference line plus an up/down-colored
#                   trend line with a white leading-edge dot. Bottom-right:
#                   a state chip label ("LIVE" while demo=OPEN) + small
#                   PAGING DOTS tracking which symbol (of 4) is showing.
#                   Nothing should clip at the 64px ceiling. FULL brightness
#                   (demo=OPEN); change colors + sparkline flicker as the
#                   demo walk moves prices.
#   2 LIVE FEED   — same card, real prices; global brightness + the state
#                   chip label track market state (LIVE full / PRE·AH
#                   ~0.85 dimmer, chip reads "PRE"/"AH" / CLOSED ~0.45
#                   dimmest, chip reads "CLSD" + an "AT CLOSE" note, prices
#                   frozen at last close). Bad symbol -> em-dash price with
#                   no sparkline. Prices refresh ~once a minute when open.
#
# NOT here yet (Phase 3): price-flash on update, sparkline/state-chip pulse.
#
# If anything looks wrong: docs/visual-validation.md.

[display]
rows = 32
cols = 64
chain_length = 8
parallel = 1
pixel_mapper_config = "Remap:256,64|192,32n|192,0n|128,32n|128,0n|64,32n|64,0n|0,32n|0,0n"
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
gpio_slowdown = 3
pwm_bits = 8

# --- 1: demo feed (offline, no token) -----------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 5.2

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA"]
demo = true

# --- 2: live feed (needs FINNHUB_API_TOKEN in .env) ---------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 5.2

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA", "AMZN", "GOOGL"]
update_interval = 60
