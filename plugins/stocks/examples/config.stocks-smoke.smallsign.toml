# Smallsign SMOKE TEST — stocks.ticker crawl + a MIXED-COLOR inline price token
#
# The crawl WIDGET and the inline `:stocks.dks:` TOKEN share ONE `QuoteCache`
# (DKS fetched once per cycle for both — dedup). The token line here is a
# MIXED-COLOR demo: the literal "DKS " is white (the message `font_color`) and
# the price is GREEN (up) / RED (down) by trend, because the `[[source]]` carries
# a `color` provider (`stocks.trend`) that colors just the token.
#
# Prereqs on the sign:
#   - led-ticker-core >= 4.14.0 (colored value tokens — a `[[source]] color`
#     that tints just the `:id:` token). On an OLDER
#     core the `color` line is ignored and the WHOLE message renders in
#     `font_color` (white) — no mixed color, everything else still works.
#   - led-ticker-stocks >= 0.5.0 (the `stocks.trend` color provider). In
#     config/requirements-plugins.txt:  led-ticker-stocks==0.5.0
#   - copy to config/config.toml, then `make restart`
#
# ONE MODE PER PROCESS (shared cache, first-started-wins):
#   - DEMO (default): leave `demo = true` on the crawl, no FINNHUB_API_TOKEN.
#     The whole cache — crawl AND token — runs the synthesized feed.
#   - LIVE: put FINNHUB_API_TOKEN=xxxxx in .env (secrets are env-only) AND
#     remove `demo = true`. Real prices everywhere.
#
# Preflight: led-ticker validate config/config.toml  -> expect: No issues found.
#
# WHAT TO LOOK FOR, section by section:
#   1 MIXED-COLOR TOKEN — a scrolling MESSAGE reading "DKS 000.00 +0.00%". The
#                    "DKS " label is WHITE; the price + signed percent are GREEN
#                    when DKS is up on the day, RED when down (trend color on the
#                    token only — the two colors on ONE line is the thing to
#                    verify). In demo the price random-walks so the color flips
#                    over ~30s. This DKS is the SAME DKS the crawl fetches.
#   2 CRAWL        — DKS / MSFT / NVDA / TSLA crawl right->left continuously at
#                    26 px/s and LOOP SEAMLESSLY. Per symbol: WHITE ticker ->
#                    AMBER price -> change block GREEN ▲ (up) / RED ▼ (down).
#                    In live mode global brightness tracks market state.
#
# If anything looks wrong: docs/visual-validation.md.

[display]
rows = 16
cols = 32
chain_length = 5
brightness = 60
gpio_slowdown = 2
hardware_mapping = "adafruit-hat"

# stocks.quote source: DKS as an inline `:stocks.dks:` token, shared with the
# crawl (one fetch for both). `color` tints JUST the token by trend — green up /
# red down (same provider the ticker widget uses). `format` drops the arrow glyph
# (the color conveys direction); smallsign is BDF (scale 1), no hi-res font.
[[source]]
id = "stocks.dks"
type = "stocks.quote"
symbol = "DKS"
format = "{price} {pct}"
color = {style = "stocks.trend", symbol = "DKS"}
# interval = 60

# --- 1: mixed-color inline token (shares the cache with the crawl) ------------
[[playlist.section]]
mode = "ticker"

[[playlist.section.widget]]
type = "message"
text = "DKS :stocks.dks:"
font_color = [255, 255, 255]   # "DKS " white; the token is trend-colored

# --- 2: stocks.ticker crawl ---------------------------------------------------
[[playlist.section]]
mode = "ticker"

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["DKS", "MSFT", "NVDA", "TSLA"]
demo = true
# green_up = false     # uncomment to flip to red-up / green-down (non-US convention)
# update_interval = 60 # (LIVE only) with a token set + `demo` removed
