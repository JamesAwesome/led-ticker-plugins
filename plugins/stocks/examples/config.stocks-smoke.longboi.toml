# Longboi SMOKE TEST — stocks.ticker DASHBOARD layout at scale 4 (pre-merge branch)
#
# No `layout` override here on purpose: `resolve_layout` reads the real
# (unwrapped) canvas width and auto-selects `dashboard` at this geometry
# (512px real width) — the same auto-select a config in the wild gets by
# just omitting `layout`. `mode = "slideshow"` is the recommended section
# mode for held layouts (card/dashboard hold one symbol per visit, unlike
# the scrolling `crawl`, which wants `mode = "ticker"`).
#
# IMPORTANT: the dashboard's watch column (the next-3-symbols strip on the
# right) reads the widget's OWN full symbol list — it does not see other
# widgets in the section. Keep the stocks widget ALONE in its section (as
# below) so the watch column shows the intended neighbors instead of
# whatever another widget happens to be doing.
#
# Prereqs on the sign:
#   - led-ticker-core >= 4.9
#   - stocks plugin (NOT yet released — Phase 2 PR). Add to
#     config/requirements-plugins.txt the git ref:
#       led-ticker-stocks @ git+https://github.com/JamesAwesome/led-ticker-plugins.git@feat/stocks-phase2#subdirectory=plugins/stocks
#   - Section 1 (demo) needs NO token. Section 2 (live) needs:
#       FINNHUB_API_TOKEN=xxxxx   in .env  (secrets are env-only, never here)
#   - copy to config/config.toml, then `make restart`
#
# Preflight: led-ticker validate config/config.toml  -> expect: No issues found.
#
# WHAT TO LOOK FOR, section by section (each symbol HELD ~5.2s, then the
# section transitions to the next symbol):
#   1 DEMO FEED   — one trading-DASHBOARD view per symbol: hero SYMBOL +
#                   brand CHIP (abstract two-tone diagonal block, never a
#                   logo) + state-chip label on the left; big PRICE + ▲/▼
#                   signed change/percent (green up / red down) + "PREV"
#                   reference price in the middle; a SPARKLINE (dotted
#                   prev-close line + up/down trend + white leading dot)
#                   right of that; and on the far right a WATCH COLUMN
#                   listing the NEXT 3 symbols with their percent change,
#                   plus small PAGING DOTS below it tracking which symbol
#                   (of 4) is in focus. Nothing should clip at the 64px
#                   ceiling. FULL brightness (demo=OPEN); change colors +
#                   sparkline + watch-column percents flicker as the demo
#                   walk moves prices.
#   2 LIVE FEED   — same dashboard, real prices; global brightness + the
#                   state-chip label track market state (LIVE full / PRE·AH
#                   ~0.85 dimmer, chip reads "PRE"/"AH" / CLOSED ~0.45
#                   dimmest, chip reads "CLSD", prices frozen at last
#                   close). Bad symbol -> em-dash price with no sparkline;
#                   its watch-column row still shows the symbol. Prices
#                   refresh ~once a minute when open.
#
# NOTE (longboi color wiring): these panels wire HUB75 G→Red, R→Blue, B→Green,
# so led_rgb_sequence = "BRG" is REQUIRED or the up/down green/red will look
# wrong. If green reads as blue or red as green, that line is the first suspect.
#
# NOT here yet (Phase 3): price-flash on update, sparkline/state-chip pulse.
#
# If anything looks wrong: docs/visual-validation.md.

[display]
rows = 64
cols = 128
chain_length = 4
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
panel_type = "FM6126A"
# Muen P2 panels wire HUB75 G-pin → Red LED, R-pin → Blue LED, B-pin → Green LED.
led_rgb_sequence = "BRG"

# --- 1: demo feed (offline, no token) -----------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 5.2

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA"]
demo = true

# --- 2: live feed (needs FINNHUB_API_TOKEN in .env) ---------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 5.2

[[playlist.section.widget]]
type = "stocks.ticker"
symbols = ["AAPL", "MSFT", "NVDA", "TSLA", "AMZN", "GOOGL", "META", "AMD"]
update_interval = 60
