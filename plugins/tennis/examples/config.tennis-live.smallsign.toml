# Demo needs no key. Live mode reads LIVETENNIS_API_KEY from the environment.
# Use these settings for the named sign. Check small letters and score columns.

[display]
rows = 16
cols = 32
chain_length = 5
parallel = 1
default_scale = 1
hardware_mapping = "adafruit-hat"
gpio_slowdown = 2

# The webui sidecar (COMPOSE_PROFILES=webui) exits and restart-loops without a
# [web] block, for as long as this config is in place. Harmless on signs that
# don't run the sidecar.
[web]
http_host = "0.0.0.0"
http_port = 8080
allow_restart = true

[[playlist.section]]
mode = "ticker"
hold_time = 8.0

[[playlist.section.widget]]
type = "tennis.scores"
layout = "auto"
timezone = "America/New_York"
update_interval = 900
demo = false
