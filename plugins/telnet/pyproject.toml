[project]
name = "led-ticker-telnet"
version = "0.1.0"
description = "Telnet (ANSI terminal) rendering backend for led-ticker — watch your sign in a terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@jamestheaweso.me" }]
keywords = [
    "led-ticker",
    "led-ticker-plugin",
    "raspberry-pi",
    "led-matrix",
    "rgb-led-matrix",
    "telnet",
    "ansi",
    "terminal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
dependencies = [
    "led-ticker-core>=2.2",
]

# The plugin is contributed to led-ticker via this entry point. The entry-point
# NAME ("telnet") becomes the plugin namespace, so the backend is selected in
# TOML as `[display] backend = "telnet.telnet"`.
[project.entry-points."led_ticker.plugins"]
telnet = "led_ticker_telnet:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://docs.ledticker.dev"
Repository = "https://github.com/JamesAwesome/led-ticker-plugins"
Issues = "https://github.com/JamesAwesome/led-ticker-plugins/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_telnet"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# Self-contained async test config: the workspace-root pyproject also sets this,
# but pinning it here lets `pytest` rooted at plugins/telnet/ (standalone dev,
# the plugin extracted/pinned on its own) run the async tests without relying on
# the workspace root being present.
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 90
