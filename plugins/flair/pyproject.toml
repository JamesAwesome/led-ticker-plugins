[project]
name = "led-ticker-flair"
dynamic = ["version"]
description = "Sprite-trail transitions, text animations, and flashy widgets for led-ticker: nyancat/pokeball/pacman/sailor_moon transitions, flair.fireworks & flair.spinout transitions, flair.propeller & flair.fisheye animations, and the flair.lottery ball-draw widget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "James Awesome", email = "james@morelli.nyc" }]
keywords = [
    "led-ticker",
    "led-ticker-plugin",
    "raspberry-pi",
    "led-matrix",
    "rgb-led-matrix",
    "transitions",
    "animation",
    "pixel-art",
    "sprite",
    "homage",
    "lottery",
    "fireworks",
    "fisheye",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]
dependencies = [
    # 4.26 ships pixel_native_size on led_ticker.plugin (lottery pixel-grid
    # snap for auto_font_size — crisp Spleen ball faces)
    "led-ticker-core>=4.26",
]

[project.urls]
Homepage = "https://docs.ledticker.dev"
Documentation = "https://docs.ledticker.dev/plugins/"
Repository = "https://github.com/JamesAwesome/led-ticker-plugins"
Issues = "https://github.com/JamesAwesome/led-ticker-plugins/issues"
Changelog = "https://github.com/JamesAwesome/led-ticker-plugins/releases"

# Each entry-point NAME is a plugin namespace -> e.g. transition = "nyancat.forward".
# One wheel, five namespaces (the loader iterates entry points, not distributions).
# ``flair`` is named after the wheel itself — documented exception to the
# namespace-per-sprite-family pattern.
[project.entry-points."led_ticker.plugins"]
nyancat     = "led_ticker_flair.nyancat:register"
pokeball    = "led_ticker_flair.pokeball:register"
pacman      = "led_ticker_flair.pacman:register"
sailor_moon = "led_ticker_flair.sailor_moon:register"
flair       = "led_ticker_flair.flair:register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Per-plugin tag scoping: only flair-v* tags count toward flair's version.
root = "../.."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "flair-v*"]
tag_regex = "^(?:.+-v)(?P<version>[0-9].*)$"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/led_ticker_flair"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
fail_under = 90
