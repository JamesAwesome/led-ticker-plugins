# requires-plugins: led-ticker-flair
# Bigsign SMOKE TEST: flair.splitflap transition (the flair release that ships it)
#
# Prereqs: led-ticker-core >= 4.32; led-ticker-flair at the release that ships
# splitflap. Copy to config/config.toml, then `make restart`.
# Preflight: led-ticker validate config/config.toml.
#
# Sections: forward (different lengths), reverse, alternating on navy, random,
# BG HOLD (teal then purple; the bg lands at the snap), a rainbow-bordered
# message (the ring stays put), two_row (scale 2: per-row hinges, and the
# message -> two_row entry), a gif in and out (cut into strips), a knob
# section (flips = 0, stagger = 0.8) and a letterboxed section (scale 2,
# content 16). Each section's own `transition` also runs as its ENTRY.

[display]
rows = 32
cols = 64
chain_length = 8
parallel = 1
pixel_mapper_config = "Remap:256,64|192,32n|192,0n|128,32n|128,0n|64,32n|64,0n|0,32n|0,0n"
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
gpio_slowdown = 3
pwm_bits = 8

[title]
delay = 0

[transitions]
default = "cut"
duration = 3.0
between_sections = "flair.splitflap.forward"

# 1. forward, different lengths
[[playlist.section]]
mode = "slideshow"
hold_time = 1.0
transition = "flair.splitflap.forward"

[[playlist.section.widget]]
type = "message"
text = "NOW BOARDING"
font_color = [255, 120, 40]
font = "Inter-Bold"
font_size = 30

[[playlist.section.widget]]
type = "message"
text = "GATE 12"
font_color = [80, 200, 255]
font = "Inter-Bold"
font_size = 30



