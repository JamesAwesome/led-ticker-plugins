mode = "slideshow"
hold_time = 1.5
transition = {type = "flair.laser.left", write_from = "right"}

[[playlist.section.widget]]
type = "message"
text = "12 EXIT LEFT"
font_color = [255, 120, 40]
font = "Inter-Bold"
font_size = 30

[[playlist.section.widget]]
