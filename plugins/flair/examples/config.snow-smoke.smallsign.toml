# Smallsign SMOKE TEST — flair.snow background + transition
#
# Purpose: headless render-demo smoke fixture on a 160x16 (default_scale = 1) canvas.
# rows=16/cols=160/chain_length=1 gives the headless backend the final
# logical canvas directly (see config.fireworks-smoke.smallsign.toml). This is a
# render-demo fixture, not a hardware wiring config; real deploys use
# config/config.example.toml in the core repo.
#
# Preflight: led-ticker validate plugins/flair/examples/config.snow-smoke.smallsign.toml
#   -> expect: no errors.
#
# WHAT TO LOOK FOR:
#   Section 1 — dot snowflakes fall behind "SNOWFALL".
#   Section 2 — built-in 5x5 snowflake sprites (painted 1:1, 5 LEDs wide on
#     the scaled signs) fall behind "WINTER".
#   Between them the snow transition sweeps a ragged front of flakes down the
#     panel, swapping content behind the flurry; flakes thin out by the snap.

[display]
rows = 16
cols = 160
chain_length = 1
parallel = 1

brightness = 60
default_scale = 1
hardware_mapping = "adafruit-hat"

[transitions]
between_sections = "flair.snow"
duration = 1.6

# --- Section 1: dot flakes behind steady text --------------------------------

[[playlist.section]]
mode = "slideshow"
hold_time = 4

[[playlist.section.widget]]
type = "message"
text = "SNOWFALL"
center = true
font_color = [200, 230, 255]
background = "flair.snow"

# --- Section 2: emoji (flake = "flake") flakes ---------------------------------

[[playlist.section]]
mode = "slideshow"
hold_time = 4

[[playlist.section.widget]]
type = "message"
text = "WINTER"
center = true
font_color = [255, 200, 120]
background = {style = "flair.snow", flake = "flake", density = 1.0}
