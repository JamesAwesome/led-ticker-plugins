# requires-plugins: led-ticker-flair
# Bigsign SMOKE TEST — flair.poker transition (flair >= 0.10.0)
#
# Prereqs on the sign:
#   - led-ticker-core >= 4.18.0 (released; `git pull && make update` rebuilds)
#   - led-ticker-flair >= 0.10.0 (PyPI pin in config/requirements-plugins.txt:
#     led-ticker-flair==0.10.0), then `docker compose down -v && docker compose up -d`
#   - copy to config/config.toml, then `make restart`
#
# Preflight: led-ticker validate config/config.toml  -> expect: No issues found.
#   (Then try changing "diamonds" to "stars" in section 1 and re-validate — it
#    must FAIL naming the suit. Put it back.)
#
# WHAT TO LOOK FOR (transitions fire between the widgets INSIDE each section,
# and on each section's entry):
#   — NOTE: the second half of each transition reveals the incoming widget
#     AGAINST BLACK (not composited over the outgoing), the approved constraint
#     from the design spec — ripple wakes show incoming text over black, no old
#     content visible through the rings.
#
#   1 ALL SUITS          — hearts, diamonds, clubs, spades glyphs pop in and
#                          ripple outward as suit-shaped rings; rings cycle
#                          through hues. Mid-way (~45% of the transition) it
#                          cuts to the incoming widget and rings wash it in
#                          against black. No black flash at the cut; clean snap.
#   2 SEEDED REPEAT      — seed = 99: every firing lays IDENTICAL glyph
#                          positions and hues. Watch it twice to confirm
#                          reproducibility.
#   3 DIAMONDS ONLY      — only diamond-shaped ripples; no other suits
#                          visible.
#   4 CLUBS ONLY         — only club-shaped ripples; note that clubs are the
#                          trickiest shape — not radially monotone — so the
#                          full-reveal guarantee test includes clubs
#                          specifically.
#   5 HEARTS + SPADES    — just these two suits. The mixed pool cycles
#                          different from the seeded all-suits above.
#   6 BG HOLD            — the DARK PURPLE background of the incoming widget
#                          must be purple the instant the last ripples reach
#                          the edges — no black flash, no "border on black" tick.
#   7 PERF FEEL          — through every transition the motion stays smooth
#                          (no stutter on the first frame when the ring cache
#                          warms — cache prep happens once, not per frame).
#                          Scrolling text before/after stays fluid.
#
# If anything looks wrong: docs/visual-validation.md; reference renders in
# session GIFs.

[display]
rows = 32
cols = 64
chain_length = 8
parallel = 1
pixel_mapper_config = "Remap:256,64|192,32n|192,0n|128,32n|128,0n|64,32n|64,0n|0,32n|0,0n"
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
gpio_slowdown = 3
pwm_bits = 8

[title]
delay = 0

[transitions]
default = "cut"
duration = 2.5
easing = "ease_in_out"
between_sections = "cut"

# ---------------------------------------------------------------------------
# 1 · ALL SUITS — hearts, diamonds, clubs, spades
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 3
transition = "flair.poker"

[[playlist.section.widget]]
type = "message"
text = "1 ALL SUITS"
font_color = [255, 100, 150]
font = "Inter-Bold"
font_size = 44

[[playlist.section.widget]]
type = "message"
text = "RIPPLE"
font_color = [100, 200, 255]
font = "Inter-Bold"
font_size = 44

# ---------------------------------------------------------------------------
# 2 · SEEDED REPEAT — same layout every firing
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 3
transition = {type = "flair.poker", seed = 99}

[[playlist.section.widget]]
type = "message"
text = "2 SEED 99"
font_color = [255, 220, 100]
font = "Inter-Bold"
font_size = 44

[[playlist.section.widget]]
type = "message"
text = "SAME AGAIN"
font_color = [255, 220, 100]
font = "Inter-Bold"
font_size = 44

# ---------------------------------------------------------------------------
# 3 · DIAMONDS ONLY
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 3
transition = {type = "flair.poker", suits = ["diamonds"]}

[[playlist.section.widget]]
type = "message"
text = "3 DIAMONDS"
font_color = "rainbow"
font = "Inter-Bold"
font_size = 44

[[playlist.section.widget]]
type = "message"
text = "ONLY"
font_color = "color_cycle"
font = "Inter-Bold"
font_size = 44

# ---------------------------------------------------------------------------
# 4 · CLUBS ONLY
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 3
transition = {type = "flair.poker", suits = ["clubs"]}

[[playlist.section.widget]]
type = "message"
text = "4 CLUBS"
font_color = [100, 255, 150]
font = "Inter-Bold"
font_size = 44

[[playlist.section.widget]]
type = "message"
text = "FULL REVEAL"
font_color = [100, 255, 150]
font = "Inter-Bold"
font_size = 44

# ---------------------------------------------------------------------------
# 5 · HEARTS + SPADES
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 3
transition = {type = "flair.poker", suits = ["hearts", "spades"]}

[[playlist.section.widget]]
type = "message"
text = "5 HEARTS"
font_color = "rainbow"
font = "Inter-Bold"
font_size = 44

[[playlist.section.widget]]
type = "message"
text = "AND SPADES"
font_color = "rainbow"
font = "Inter-Bold"
font_size = 44

# ---------------------------------------------------------------------------
# 6 · BG HOLD — incoming bg must be there the instant the wash finishes
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 3
transition = "flair.poker"

[[playlist.section.widget]]
type = "message"
text = "6 TO PURPLE"
font_color = [255, 150, 100]
font = "Inter-Bold"
font_size = 44

[[playlist.section.widget]]
type = "message"
text = "BG COLOR"
font_color = [255, 220, 200]
bg_color = [60, 20, 120]
font = "Inter-Bold"
font_size = 44
