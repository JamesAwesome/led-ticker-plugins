# requires-plugins: led-ticker-flair
# Bigsign SMOKE TEST: flair.blinds transition (the flair release that ships it)
#
# Prereqs: led-ticker-core >= 4.32; led-ticker-flair at the release that ships
# blinds (PyPI pin in config/requirements-plugins.txt), then
# `docker compose down -v && docker compose up -d`; copy to config/config.toml,
# then `make restart`. Preflight: led-ticker validate config/config.toml.
#
# Sections: each fixed variant; alternating on a navy bg (watch two cycles;
# the navy holds until each reveal/mesh lands); random (never
# the same twice running); BG HOLD (teal then purple, no black flash); a
# rainbow-bordered message; a two_row (scale 2, so also a cross-scale entry);
# a full-panel gif (perf worst case, stock assets/phoenix.gif); a knob
# section; and a letterboxed section (scale 2, content 16). Each section's own
# `transition` also runs as its ENTRY (core
# precedence), so every section boundary fires the transition too.

[display]
rows = 32
cols = 64
chain_length = 8
parallel = 1
pixel_mapper_config = "Remap:256,64|192,32n|192,0n|128,32n|128,0n|64,32n|64,0n|0,32n|0,0n"
brightness = 60
default_scale = 4
hardware_mapping = "adafruit-hat"
gpio_slowdown = 3
pwm_bits = 8

[title]
delay = 0

[transitions]
default = "cut"
duration = 1.0
between_sections = "flair.blinds.down"

[[playlist.section]]
mode = "slideshow"
hold_time = 1.0
transition = "flair.blinds.down"

[[playlist.section.widget]]
type = "message"
text = "1 DOWN"
font_color = [255, 120, 40]
font = "Inter-Bold"
font_size = 30

[[playlist.section.widget]]
type = "message"
text = "SLATS OPEN"
font_color = [80, 200, 255]
font = "Inter-Bold"
font_size = 30


