# Letterboxed: scale 2 / content 16 leaves a 16-row blank band above and
# below the content on the 64-row panel; the border lights those bands.
[[playlist.section]]
mode = "slideshow"
hold_time = 1.0
scale = 2
content_height = 16
transition = "flair.blinds.down"

[[playlist.section.widget]]
type = "message"
text = "10 LETTERBOX"
font_color = [255, 200, 60]
border = "rainbow"

[[playlist.section.widget]]
type = "message"
text = "BANDS"
font_color = [120, 255, 160]
border = "rainbow"
