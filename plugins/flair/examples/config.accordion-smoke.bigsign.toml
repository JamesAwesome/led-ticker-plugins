[[playlist.section.widget]]
type = "message"
text = "BORDER"
font_color = [80, 200, 255]
font = "Inter-Bold"
font_size = 30
border = {style = "rainbow", speed = 4}

# ---------------------------------------------------------------------------
# 9 BORDER - lightbulbs
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 1.5
transition = "flair.accordion.stretch"

[[playlist.section.widget]]
type = "message"
text = "9 BULBS"
font_color = [255, 120, 40]
font = "Inter-Bold"
font_size = 30
border = {style = "lightbulbs", mode = "alternate"}

[[playlist.section.widget]]
type = "message"
text = "BORDER"
font_color = [80, 200, 255]
font = "Inter-Bold"
font_size = 30
border = {style = "lightbulbs", mode = "alternate"}

# ---------------------------------------------------------------------------
# 10 TWO ROW - each band forms its own deck
# ---------------------------------------------------------------------------
[[playlist.section]]
mode = "slideshow"
hold_time = 1.5
transition = "flair.accordion.sweep"
scale = 2
content_height = 32

[[playlist.section.widget]]
type = "two_row"
top_text = "10 TOP ROW"
top_font = "Inter-Bold"
top_font_size = 14
top_color = [255, 120, 40]
bottom_text = "BOTTOM"
bottom_font = "Inter-Bold"
bottom_font_size = 14
bottom_color = [80, 200, 255]

[[playlist.section.widget]]
type = "two_row"
top_text = "SECOND TOP"
top_font = "Inter-Bold"
top_font_size = 14
top_color = [255, 215, 120]
bottom_text = "SECOND BOT"
bottom_font = "Inter-Bold"
bottom_font_size = 14
bottom_color = [130, 220, 150]
